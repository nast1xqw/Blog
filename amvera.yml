meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"
build:
  requirementsPath: requirements.txt
  useCache: true
run:
  command: uvicorn src.main:app --host 0.0.0.0 --port 80
  persistenceMount: /data
  containerPort: "80"
  russianTrustedCa: false
  singleton: false
  zeroDowntime: true