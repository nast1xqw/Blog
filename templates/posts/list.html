{% extends "base.html" %} 

{% block title %}Посты{% endblock %} 

{% block content %}
<div class="posts">
  {% for post in posts %}
  <article class="post">
    <h2><a href="/posts/{{ post.id }}">{{ post.title }}</a></h2>
    <p>{{ post.content }}</p>
  </article>
  {% else %}
  <p>Постов нет.</p>
  {% endfor %}
</div>
{% endblock %}
