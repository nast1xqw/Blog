{% extends "base.html" %} {% block title %}Посты{% endblock %} {% block links
%}{% endblock %} {% block content %}
<div class="posts">
  {% for post in posts %}
  <article class="post">
    <h2>{{ post.title }}</h2>
    <p>{{ post.content }}</p>
  </article>
  {% if request.cookies.get('access_token') %}
  <form
    action="/posts/{{ post.id }}/delete"
    method="POST"
    style="display: inline"
  >
    <button
      type="submit"
      class="btn-delete"
      onclick="return confirm('Вы уверены, что хотите удалить этот пост?');"
    >
      Удалить
    </button>
  </form>
  {% endif %} {% else %}
  <p>Постов нет.</p>
  {% endfor %}
</div>
{% endblock %}
