{% extends "base.html" %}

{% block title %}{{ post.title if post else 'Пост не найден' }}{% endblock %}

{% block content %}
<div class="post-detail">
    {% if post %}
        <h1>{{ post.title }}</h1>
        <p>{{ post.content }}</p>
        
        <a href="/posts/{{ post.id }}/update">Редактировать</a>
        
        <a href="{{ url_for('list_posts_page') }}">← Назад к списку</a>
    {% else %}
        <p>Пост с таким ID не найден.</p>
        <a href="{{ url_for('list_posts_page') }}">← Назад к списку</a>
    {% endif %}
</div>
{% endblock %}
